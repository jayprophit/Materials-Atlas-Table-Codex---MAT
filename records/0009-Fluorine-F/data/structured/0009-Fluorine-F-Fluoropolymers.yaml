  id: "MAT:MAT:PTFE"

  repeat_unit:
    "[-CF2-CF2-]n"

  parents:
    - "MAT:0006"
    - "MAT:0009"

  material_class:
    - fluoropolymer
    - semicrystalline_polymer

  characteristic_properties:
    - high_chemical_resistance
    - low_surface_energy
    - low_friction
    - electrical_insulation
    - thermal_resistance

  melting_region:
    approximate_value: 327
    unit: "degC"

  processing:
    conventional_melt_processing_difficult: true

  history:
    discovery_year: 1938
