  fluorine_content_can_change:
    - surface_energy
    - wetting
    - friction
    - adhesion
    - chemical_resistance

  but:
    property_is_not_monotonic_with_F_content_in_every_polymer: true

environment:

  persistence_is_compound_specific: true
  fluoropolymer_recycling_and_F_recovery:
    active_research: true

rules:
  PTFE_property_equals_fluorine_property: false
  all_fluoropolymers_equal_PTFE: false
  C_F_bond_strength_alone_determines_all_polymer_behavior: false

