historical_Bartlett_branch:

  year: 1962

  precursor_observation:
    compound: "O2+[PtF6]-"

  reasoning:
    description: >
      Bartlett recognized that the ionization energy of xenon was
      comparable to that of molecular oxygen and tested PtF6 as a
      powerful oxidizing/fluorinating reagent.

  xenon_product:
    historical_label: "Xe+[PtF6]-"
    modern_status: >
      Original product is not adequately described as one simple
      Xe+[PtF6]- salt; later work indicates a mixture of xenon
      fluoride cation salts.

