interpretation:
  scope: Ground-state evaluated atomic masses and selected linear combinations. Dated evaluation, not a claim of latest
    research or observed decay.
  hash_marker: "AME replaces the decimal point with # for estimates partly based on trends from the mass surface; not a
    direct measurement. Raw value and uncertainty strings retained."
  asterisk: Source not-calculable quantity -> numeric null, UNKNOWN; does not by itself establish physical non-applicability.
  uncertainty: Source-reported uncertainties retained directly. No quadrature of independent masses substituted;
    covariance matrix is not supplied by this package.
  sign: Signed energies retained. Positive Q is not proof of observed decay or a branching ratio; negative Q is not a
    missing value.
  alpha_particle: Q_alpha uses neutral atomic masses including He-4; it is not the emitted alpha-particle kinetic energy
    or a bare-nucleus mass difference.
  helium4_zero: He-4 Q_alpha = 0 in the source is a bookkeeping identity, not an observed decay to a physical A=0 nucleus.
  binding: AME tabulated atomic-mass convention; not a silently electron-binding-corrected bare nuclear binding energy.
  isomers: NUBASE ground-state reference is explicit. Isomer Q-values and branch-specific excitation corrections are
    outside this extraction.
  reaction_definitions: All twelve Table III combinations are retained. Q_double_beta_minus and Q_quadruple_beta_minus are
    ground-state mass differences, not evidence of observed multiple-beta decays. Q_electron_capture_proton denotes
    epsilon-p; Q_beta_minus_neutron denotes beta-minus-neutron energy balance. Q_deuteron_alpha, Q_proton_alpha and
    Q_neutron_alpha describe (d,alpha), (p,alpha) and (n,alpha) mass combinations, not cross sections or demonstrated
    reaction routes.
  light_identity_limits: Free-neutron S_n=0, H-1 S_p=0 and He-4 zero alpha/reaction entries include identity bookkeeping.
    No A=0 residual nucleus or decay is asserted.
  coverage: Three mass-file quantities and all twelve reaction-table quantities. Newer evaluations, isomer corrections,
    actual decay branches and rates remain pending.
equations:
  mass_excess: Delta = (M_atom - A*u)*c^2
  binding_energy_per_nucleon: B/A = [Z*M(1H) + N*m_n - M_atom(A,Z)]*c^2/A
  q_beta_minus: Q_beta_minus = [M_atom(A,Z) - M_atom(A,Z+1)]*c^2
  q_alpha: Q_alpha = [M_atom(A,Z) - M_atom(A-4,Z-2) - M_atom(4He)]*c^2
  separation_two_neutrons: S_2n = [M_atom(A-2,Z) + 2*m_n - M_atom(A,Z)]*c^2
  separation_two_protons: S_2p = [M_atom(A-2,Z-2) + 2*M_atom(1H) - M_atom(A,Z)]*c^2
  q_double_beta_minus: Q_2beta_minus = [M_atom(A,Z) - M_atom(A,Z+2)]*c^2
  q_electron_capture_proton: Q_epsilon_p = [M_atom(A,Z) - M_atom(A-1,Z-2) - M_atom(1H)]*c^2
  q_beta_minus_neutron: Q_beta_minus_n = [M_atom(A,Z) - M_atom(A-1,Z+1) - m_n]*c^2
  separation_neutron: S_n = [M_atom(A-1,Z) + m_n - M_atom(A,Z)]*c^2
  separation_proton: S_p = [M_atom(A-1,Z-1) + M_atom(1H) - M_atom(A,Z)]*c^2
  q_quadruple_beta_minus: Q_4beta_minus = [M_atom(A,Z) - M_atom(A,Z+4)]*c^2
  q_deuteron_alpha: Q_d_alpha = [M_atom(A,Z) - M_atom(A-2,Z-1) + M_atom(2H) - M_atom(4He)]*c^2
  q_proton_alpha: Q_p_alpha = [M_atom(A,Z) - M_atom(A-3,Z-1) + M_atom(1H) - M_atom(4He)]*c^2
  q_neutron_alpha: Q_n_alpha = [M_atom(A,Z) - M_atom(A-3,Z-2) + m_n - M_atom(4He)]*c^2
  source_locator: SRC-000304, Table III definitions, printed page 030003-102
  application: "Definitions only: stored numbers and their uncertainties are transcribed from the evaluation, not
    recalculated here."
