<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 224" width="632" height="224" role="img"><rect width="632" height="224" fill="#0f141b"/><text x="16" y="28" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#e8edf3">Helium atomic identity (MAT:0002)</text><rect x="20" y="56" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="30" y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">He · Z = 2</text><text x="30" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">2 protons / 2 electrons</text><rect x="220" y="56" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="230" y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">4.002602(2)</text><text x="230" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">standard atomic weight</text><rect x="420" y="56" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="430" y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">1s2 · 1S0</text><text x="430" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">closed shell</text><rect x="20" y="120" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="30" y="144" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">I1 = 24.587389011 eV</text><text x="30" y="162" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">SRC-000005</text><rect x="220" y="120" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="230" y="144" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">I2 = 54.4177655282 eV</text><text x="230" y="162" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">He+ → He2+</text><rect x="420" y="120" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="430" y="144" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">monatomic gas</text><text x="430" y="162" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">no stable He2</text><text x="16" y="214" font-family="system-ui,sans-serif" font-size="10" fill="#5c6b80">Closed shell ≠ no excited/ionic/plasma states.</text></svg>