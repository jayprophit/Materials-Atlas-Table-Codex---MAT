interpretation:
  scope: Experimentally inferred equilibrium geometry of an isolated neutral
    molecule; not instantaneous or averaged liquid/ice geometry.
  precision: The internal-coordinate table rounds rOH to 0.958 angstrom while its
    atom-distance matrix gives 0.9578 angstrom. Both source representations are
    retained. Decimal places do not establish uncertainty.
  isotopologue: The selected geometry page labels H2O without an explicit
    isotope-resolved qualification. Do not silently assign these values to D2O
    or all isotopologues.
  limitations: Equilibrium structure is inferred from spectroscopy and modelling;
    it is not a photograph of fixed nuclei. Original paper identified via NIST
    bibliography; full paper not retrieved in this intake.
