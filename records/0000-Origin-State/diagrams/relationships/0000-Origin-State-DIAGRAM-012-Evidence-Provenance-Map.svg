<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 366" width="520" height="366" role="img"><rect width="520" height="366" fill="#0f141b"/><text x="16" y="28" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#e8edf3">Evidence provenance routes</text><rect x="60" y="56" width="400" height="44" rx="8" fill="#161d27" stroke="#26313f"/><text x="260" y="83" font-family="system-ui,sans-serif" font-size="12" fill="#e8edf3" text-anchor="middle">MEASUREMENT → source → object</text><rect x="60" y="126" width="400" height="44" rx="8" fill="#161d27" stroke="#26313f"/><text x="260" y="153" font-family="system-ui,sans-serif" font-size="12" fill="#e8edf3" text-anchor="middle">MODEL → calculation → object</text><line x1="260" y1="100" x2="260" y2="126" stroke="#6cb2ff"/><polygon points="255,118 265,118 260,126" fill="#6cb2ff"/><rect x="60" y="196" width="400" height="44" rx="8" fill="#161d27" stroke="#26313f"/><text x="260" y="223" font-family="system-ui,sans-serif" font-size="12" fill="#e8edf3" text-anchor="middle">HYPOTHESIS → test → verdict</text><line x1="260" y1="170" x2="260" y2="196" stroke="#6cb2ff"/><polygon points="255,188 265,188 260,196" fill="#6cb2ff"/><rect x="60" y="266" width="400" height="44" rx="8" fill="#161d27" stroke="#26313f"/><text x="260" y="293" font-family="system-ui,sans-serif" font-size="12" fill="#e8edf3" text-anchor="middle">AI extraction = method, not source</text><line x1="260" y1="240" x2="260" y2="266" stroke="#6cb2ff"/><polygon points="255,258 265,258 260,266" fill="#6cb2ff"/><text x="16" y="356" font-family="system-ui,sans-serif" font-size="10" fill="#5c6b80">Root record never bypasses evidence.</text></svg>