<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 160" width="632" height="160" role="img"><rect width="632" height="160" fill="#0f141b"/><text x="16" y="28" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#e8edf3">Temperature reference (T0)</text><rect x="20" y="56" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="30" y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">ΔT = T − T0</text><text x="30" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">selected reference</text><rect x="220" y="56" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="230" y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">T0 ≠ 0 K</text><text x="230" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">unless so defined</text><rect x="420" y="56" width="192" height="56" rx="8" fill="#161d27" stroke="#26313f"/><text x="430" y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6cb2ff">0 K ≠ zero energy</text><text x="430" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#9aa7b8">quantum motion remains</text><text x="16" y="150" font-family="system-ui,sans-serif" font-size="10" fill="#5c6b80">MAT:0000 §10–§11.</text></svg>