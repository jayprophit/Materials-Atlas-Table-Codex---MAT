<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 244" width="620" height="244" role="img"><rect width="620" height="244" fill="#0f141b"/><text x="16" y="28" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#e8edf3">MAT 0000 reference origin</text><text x="40" y="80" font-family="system-ui,sans-serif" font-size="13" fill="#e8edf3">z0 = (0,0,…,0) — normalized computational origin</text><text x="40" y="110" font-family="system-ui,sans-serif" font-size="13" fill="#e8edf3">Δq = q − qref (same quantity, compatible units)</text><text x="40" y="140" font-family="system-ui,sans-serif" font-size="13" fill="#e8edf3">Δqij = qi − qj (pairwise comparison)</text><text x="40" y="170" font-family="system-ui,sans-serif" font-size="13" fill="#e8edf3">MATHEMATICAL / INFORMATION REFERENCE — NOT literal nothingness</text><text x="16" y="234" font-family="system-ui,sans-serif" font-size="10" fill="#5c6b80">MAT:0000 §3–§5. SCIENTIFIC-SCHEMATIC.</text></svg>