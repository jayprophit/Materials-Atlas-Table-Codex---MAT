<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" width="620" height="214" role="img"><rect width="620" height="214" fill="#0f141b"/><text x="16" y="28" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#e8edf3">Quantum vacuum vs classical empty space</text><text x="40" y="80" font-family="system-ui,sans-serif" font-size="13" fill="#e8edf3">CLASSICAL EMPTY-SPACE IDEALIZATION ≠ QUANTUM VACUUM STATE ≠ MAT ORIGIN</text><text x="40" y="110" font-family="system-ui,sans-serif" font-size="13" fill="#e8edf3">QV needs: model · fields · boundaries · convention</text><text x="40" y="140" font-family="system-ui,sans-serif" font-size="13" fill="#e8edf3">VAC (lab, measurable P/T/gas) ≠ QV (model-defined)</text><text x="16" y="204" font-family="system-ui,sans-serif" font-size="10" fill="#5c6b80">MAT:0000 §22. These three are NOT identical. SCIENTIFIC-SCHEMATIC.</text></svg>