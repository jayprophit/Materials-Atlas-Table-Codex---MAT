schema_version: "1.0.0"
registry_id: "MAT:REG:FREQUENCY-HISTORY-METHODS"
title: "Frequency claims, historical models and adjacent laboratory methods"
status: "RESEARCH-REFERENCE-ONLY"
scope_note: "User-supplied leads are catalogued for historical, commercial, methodological and evidence review. They are not established MAT measurements, treatment recommendations or proof of a frequency-specific biological effect."
evidence_lanes:
  established: "Peer-reviewed or standards-backed observations with state, method, uncertainty and source locator."
  emerging: "Active research or preliminary evidence requiring replication and bounded claims."
  historical_alternative: "Historical, unconventional or author-proposed material kept separate from the core catalogue."
  commercial: "Vendor claims and product descriptions; useful for equipment/context, not independent efficacy evidence."
entries:
  - id: "MAT:REF:RIFE:HISTORY"
    subject: "Royal Raymond Rife and Rife machines"
    lane: "historical_alternative"
    contributors: ["Royal Raymond Rife"]
    methods: ["low-energy electromagnetic excitation", "plasma-tube delivery claims"]
    environments: ["historical laboratory claims", "commercial wellness devices"]
    equipment: ["Rife frequency generator", "plasma tube"]
    source_urls:
      - "https://www.cancerresearchuk.org/about-cancer/treatment/complementary-alternative-therapies/individual-therapies/rife-machine-and-cancer"
      - "https://www.resonantlight.com/rife-therapy/"
      - "https://www.spooky2-mall.com/download/spooky2rifefrequencylist.pdf"
    evidence_boundary: "Cancer Research UK states that reliable evidence of cancer cure is absent and that Rife machines have not gone through usual scientific testing. Commercial pages and frequency lists remain claims/context, not efficacy evidence."
  - id: "MAT:REF:RUSSELL:PERIODIC-FREQUENCY"
    subject: "Walter Russell periodic and frequency models"
    lane: "historical_alternative"
    contributors: ["Walter Russell"]
    methods: ["octave/spiral periodic representation", "frequency-based conceptual mapping"]
    environments: ["historical/alternative educational model"]
    source_urls: []
    evidence_boundary: "Keep Russell diagrams and frequencies in the historical-model lane. Display coordinates or symbolic frequencies do not become measured atomic spectra without a source-specific physical definition and experimental support."
  - id: "MAT:REF:GENE:NEPA21"
    subject: "NEPA21 electroporator"
    lane: "commercial"
    methods: ["electroporation", "pulse-mediated membrane permeabilisation"]
    environments: ["cell and molecular biology laboratory"]
    equipment: ["NEPA21 electroporator"]
    source_urls: ["https://nepagene.jp/en/products/electroporation-en/nepa21-electroporator"]
    evidence_boundary: "Vendor equipment reference; parameters, cell type, pulse protocol and outcome must be recorded for any experiment."
  - id: "MAT:REF:GENE:4BASEBIO"
    subject: "Synthetic DNA for gene editing"
    lane: "commercial"
    methods: ["synthetic single-stranded DNA", "gene editing workflow"]
    environments: ["molecular biology laboratory"]
    equipment: ["sequence design and synthesis service"]
    source_urls: ["https://www.4basebio.com/applications/gene-editing-ssdna"]
    evidence_boundary: "Commercial service description; does not establish performance for a particular target, cell line or editing protocol."
  - id: "MAT:REF:GENE:CRISPR-ANTIBODIES"
    subject: "CRISPR-Cas9 antibody reagents"
    lane: "commercial"
    methods: ["immunodetection", "Cas9 protein detection"]
    environments: ["validated assay-specific laboratory conditions"]
    equipment: ["antibody reagent", "assay platform"]
    source_urls: ["https://www.antibodies.com/products/primary-antibodies/crispr-cas9-antibodies"]
    evidence_boundary: "Product catalogue reference; clone, species, validation assay and lot-specific performance must be preserved."
  - id: "MAT:REF:GENE:TWIST"
    subject: "Gene synthesis services"
    lane: "commercial"
    methods: ["DNA synthesis", "sequence assembly"]
    environments: ["molecular biology laboratory"]
    equipment: ["gene synthesis service"]
    source_urls: ["https://www.twistbioscience.com/products/genes"]
    evidence_boundary: "Commercial service reference, not an independent claim about biological function or editing success."
